# =============================================================================
# VULNERABLE cache configuration (the paper's Figure 1 scenario).
#
# Two independent, individually-"reasonable" decisions combine into WCD:
#   1. Cache by FILE EXTENSION: anything ending in a static-looking extension
#      (.css, .js, .png, ...) is treated as cacheable.
#   2. IGNORE the origin's Cache-Control header (proxy_ignore_headers).
#
# Neither the app owner nor the cache vendor is individually "wrong" -- WCD is
# the SYSTEM-level interaction. (Paper section 2.2.)
# =============================================================================

# Where cached responses live. keys_zone names the shared-memory index.
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=wcd:10m
                 max_size=100m inactive=60m use_temp_path=off;

server {
    listen 80;
    server_name localhost;

    # The cache key: method + host + URI. Because the URI includes the fake
    # ".css" suffix, /profile and /profile/x.css are stored as DIFFERENT keys.
    proxy_cache_key "$request_method$host$request_uri";

    # Expose the cache decision to clients. DE reads this header (paper Table 1
    # lists exactly these X-Cache-Status style headers per vendor).
    add_header X-Cache-Status $upstream_cache_status always;

    # ---- Default: pass through, do NOT cache -------------------------------
    location / {
        proxy_pass http://origin:8000;
        proxy_cache off;
    }

    # ---- The trap: requests whose path ends in a static extension ----------
    location ~* \.(css|js|png|jpe?g|gif|ico|svg|woff2?|pdf|txt)$ {
        proxy_pass http://origin:8000;

        proxy_cache wcd;
        proxy_cache_valid 200 10m;          # cache 200s for 10 minutes

        # THE VULNERABILITY: disregard what the origin said about caching.
        # The origin sent "Cache-Control: no-store"; we ignore it and cache.
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Cache-Control;

        add_header X-Cache-Status $upstream_cache_status always;
    }
}
