# HONOUR-HEADERS config: still caches static-looking URLs, but RESPECTS the
# origin's Cache-Control. Sensitive pages (no-store) are therefore NOT cached,
# so real leaks stop. Public pages (Cache-Control: public) are still cached --
# which is fine, but DE still flags them (residual false positives).
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=wcd:10m
                 max_size=100m inactive=60m use_temp_path=off;
server {
    listen 80; server_name localhost;
    proxy_cache_key "$request_method$host$request_uri";
    add_header X-Cache-Status $upstream_cache_status always;
    location / { proxy_pass http://origin:8000; proxy_cache off; }
    location ~* \.(css|js|png|jpe?g|gif|ico|svg|woff2?|pdf|txt)$ {
        proxy_pass http://origin:8000;
        proxy_cache wcd;
        proxy_cache_valid 200 10m;
        # NOTE: no proxy_ignore_headers here -> nginx obeys no-store.
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
